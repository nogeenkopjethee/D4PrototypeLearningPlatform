version: '3.4'

services:
  d4prototypelearningplatform:
    image: d4prototypelearningplatform
    build:
      context: .
      dockerfile: D4PrototypeLearningPlatform/Dockerfile
    depends_on:
      - db
    ports:
      - "6543:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
  db:
    image: postgres
    container_name: d4db
    ports:
      - 5432:5432
    environment:
      - POSTGRES_PASSWORD=SuperSecurePassword4267